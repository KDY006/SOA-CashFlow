# Docker Compose - Báo cáo Giữa kỳ (Triển khai các Services với Code thuần / Native)
version: '3.8'

services:
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: cashflow-gateway-midterm
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      - APP_ENV=midterm
      - AUTH_SERVICE_URL=http://auth-service:8081
      - TRANSACTION_SERVICE_URL=http://transaction-service:8082
      - ASSET_SERVICE_URL=http://asset-service:8083
      - ANALYTICS_SERVICE_URL=http://analytics-service:8084
      - INTEGRATION_SERVICE_URL=http://integration-service:8085
      - NOTIFICATION_SERVICE_URL=http://notification-service:8086
    depends_on:
      - auth-service
      - transaction-service
      - asset-service
      - analytics-service
      - integration-service
      - notification-service
    networks:
      - midterm-network

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: cashflow-auth-midterm
    ports:
      - "${AUTH_SERVICE_PORT:-8081}:8081"
    environment:
      - PROFILE=native
      - DB_HOST=auth-db
    depends_on:
      - auth-db
    networks:
      - midterm-network

  transaction-service:
    build:
      context: ./services/transaction-service
      dockerfile: Dockerfile
    container_name: cashflow-transaction-midterm
    ports:
      - "${TRANSACTION_SERVICE_PORT:-8082}:8082"
    environment:
      - PROFILE=native
      - DB_HOST=transaction-db
    depends_on:
      - transaction-db
    networks:
      - midterm-network

  asset-service:
    build:
      context: ./services/asset-service
      dockerfile: Dockerfile
    container_name: cashflow-asset-midterm
    ports:
      - "${ASSET_SERVICE_PORT:-8083}:8083"
    environment:
      - PROFILE=native
      - DB_HOST=asset-db
    depends_on:
      - asset-db
    networks:
      - midterm-network

  analytics-service:
    build:
      context: ./services/analytics-service
      dockerfile: midterm/Dockerfile
    container_name: cashflow-analytics-midterm
    restart: always
    ports:
      - "${ANALYTICS_SERVICE_PORT:-8084}:8084"
    environment:
      - HOST=0.0.0.0
      - PORT=8084
      - TRANSACTION_SERVICE_URL=http://transaction-service:8082
      - ANALYTICS_DB_HOST=analytics-db
      - ANALYTICS_DB_PORT=3306
      - ANALYTICS_DB_NAME=analytics_db
      - ANALYTICS_DB_USER=root
      - ANALYTICS_DB_PASSWORD=${ANALYTICS_DB_PASSWORD:-root_password}
    depends_on:
      - transaction-service
      - analytics-db
    networks:
      - midterm-network

  integration-service:
    build:
      context: ./services/integration-service
      dockerfile: Dockerfile
    container_name: cashflow-integration-midterm
    ports:
      - "${INTEGRATION_SERVICE_PORT:-8085}:8085"
    environment:
      - PROFILE=native
      - DB_HOST=integration-db
    depends_on:
      - integration-db
    networks:
      - midterm-network

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: cashflow-notification-midterm
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-8086}:8086"
    environment:
      - PROFILE=native
      - REDIS_HOST=redis
    depends_on:
      - redis
    networks:
      - midterm-network

  auth-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: auth_db
    volumes:
      - ./services/auth-service/db/init-auth-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - midterm-network

  transaction-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: transaction_db
    volumes:
      - ./services/transaction-service/db/init-transaction-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - midterm-network

  asset-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: asset_db
    volumes:
      - ./services/asset-service/db/init-asset-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - midterm-network

  integration-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: integration_db
    volumes:
      - ./services/integration-service/db/init-integration-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - midterm-network

  analytics-db:
    image: mysql:8.0
    container_name: cashflow-analytics-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: analytics_db
    volumes:
      - ./services/analytics-service/db/init-analytics-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - analytics_midterm_db_data:/var/lib/mysql
    networks:
      - midterm-network

  redis:
    image: redis:7-alpine
    networks:
      - midterm-network

networks:
  midterm-network:
    driver: bridge

volumes:
  analytics_midterm_db_data:
