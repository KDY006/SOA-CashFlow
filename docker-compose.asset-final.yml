name: cashflow-asset-dev

services:
  asset-service:
    image: cashflow-asset-final:local
    build:
      context: ./services/asset-service/final
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${ASSET_SERVICE_PORT:-8083}:8083"
    environment:
      ASPNETCORE_URLS: "http://+:8083"
      DB_CONNECTION: "Server=asset-db;Port=3306;Database=asset_db;Uid=root;Pwd=${ASSET_DB_PASSWORD:-root_password};"
      JWT_SECRET: "${AUTH_JWT_SECRET:?set AUTH_JWT_SECRET in .env}"
      ENABLE_SWAGGER: "true"
    depends_on:
      asset-db:
        condition: service_healthy

  asset-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: "${ASSET_DB_PASSWORD:-root_password}"
      MYSQL_DATABASE: asset_db
    volumes:
      - ./services/asset-service/final/db/init-asset-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - asset_dev_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mysql --protocol=TCP -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" -D asset_db -e 'SELECT 1 FROM assets LIMIT 1' >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 360s

  auth-service:
    profiles: ["auth"]
    image: cashflow-auth-asset-dev:local
    build:
      context: ./services/auth-service/midterm
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${AUTH_SERVICE_PORT:-8081}:8081"
    environment:
      PROFILE: native
      DB_HOST: auth-db
      DB_PORT: "3306"
      DB_NAME: auth_db
      DB_USER: root
      DB_PASSWORD: "${AUTH_FINAL_DB_PASSWORD:-${AUTH_DB_PASSWORD:-root_password}}"
      JWT_SECRET: "${AUTH_JWT_SECRET:?set AUTH_JWT_SECRET in .env}"
    depends_on:
      auth-db:
        condition: service_healthy

  auth-db:
    profiles: ["auth"]
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: "${AUTH_FINAL_DB_PASSWORD:-${AUTH_DB_PASSWORD:-root_password}}"
      MYSQL_DATABASE: auth_db
    volumes:
      - ./services/auth-service/db/init-auth-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - auth_dev_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mysql --protocol=TCP -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" -D auth_db -e 'SELECT 1 FROM users LIMIT 1' >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 360s

  gateway:
    profiles: ["auth"]
    image: cashflow-gateway-asset-dev:local
    build:
      context: ./gateway/midterm
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      GATEWAY_PORT: "8080"
      GATEWAY_HOST: "0.0.0.0"
      IS_DOCKER: "true"
      AUTH_SERVICE_URL: "http://auth-service:8081"
      ASSET_SERVICE_URL: "http://asset-service:8083"
      JWT_SECRET: "${AUTH_JWT_SECRET:?set AUTH_JWT_SECRET in .env}"
    depends_on:
      auth-service:
        condition: service_started
      asset-service:
        condition: service_started

volumes:
  asset_dev_data:
  auth_dev_data:
