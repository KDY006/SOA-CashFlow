# Docker Compose - Báo cáo Cuối kỳ (Triển khai các Services với Framework chuẩn)
version: '3.8'

services:
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: cashflow-gateway-final
    restart: always
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      - APP_ENV=production
      - AUTH_SERVICE_URL=http://auth-service:8081
      - TRANSACTION_SERVICE_URL=http://transaction-service:8082
      - ASSET_SERVICE_URL=http://asset-service:8083
      - ANALYTICS_SERVICE_URL=http://analytics-service:8084
      - INTEGRATION_SERVICE_URL=http://integration-service:8085
      - NOTIFICATION_SERVICE_URL=http://notification-service:8086
    depends_on:
      - auth-service
      - transaction-service
      - asset-service
      - analytics-service
      - integration-service
      - notification-service
    networks:
      - final-network

  # 1. Spring Boot (Java)
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: cashflow-auth-final
    restart: always
    ports:
      - "${AUTH_SERVICE_PORT:-8081}:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=auth-db
      - DB_NAME=auth_db
      - DB_USER=root
      - DB_PASSWORD=root_password
    depends_on:
      - auth-db
    networks:
      - final-network

  # 2. Laravel (PHP)
  transaction-service:
    build:
      context: ./services/transaction-service
      dockerfile: Dockerfile
    container_name: cashflow-transaction-final
    restart: always
    ports:
      - "${TRANSACTION_SERVICE_PORT:-8082}:8082"
    environment:
      - APP_ENV=production
      - DB_HOST=transaction-db
      - DB_DATABASE=transaction_db
      - DB_USERNAME=root
      - DB_PASSWORD=root_password
    depends_on:
      - transaction-db
    networks:
      - final-network

  # 3. ASP.NET Core (C#)
  asset-service:
    build:
      context: ./services/asset-service
      dockerfile: Dockerfile
    container_name: cashflow-asset-final
    restart: always
    ports:
      - "${ASSET_SERVICE_PORT:-8083}:8083"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DB_HOST=asset-db
      - DB_NAME=asset_db
      - DB_USER=root
      - DB_PASSWORD=root_password
    depends_on:
      - asset-db
    networks:
      - final-network

  # 4. FastAPI (Python)
  analytics-service:
    build:
      context: ./services/analytics-service
      dockerfile: Dockerfile
    container_name: cashflow-analytics-final
    restart: always
    ports:
      - "${ANALYTICS_SERVICE_PORT:-8084}:8084"
    environment:
      - APP_ENV=production
      - MONGO_URI=mongodb://mongo_admin:mongo_password@analytics-mongo:27017/analytics_db?authSource=admin
    depends_on:
      - analytics-mongo
    networks:
      - final-network

  # 5. Go Gin (Go)
  integration-service:
    build:
      context: ./services/integration-service
      dockerfile: Dockerfile
    container_name: cashflow-integration-final
    restart: always
    ports:
      - "${INTEGRATION_SERVICE_PORT:-8085}:8085"
    environment:
      - GIN_MODE=release
      - DB_HOST=integration-db
      - DB_NAME=integration_db
      - DB_USER=root
      - DB_PASSWORD=root_password
    depends_on:
      - integration-db
    networks:
      - final-network

  # 6. NestJS / Express (Node.js)
  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: cashflow-notification-final
    restart: always
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-8086}:8086"
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
    depends_on:
      - redis
    networks:
      - final-network

  auth-db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: auth_db
    volumes:
      - ./services/auth-service/db/init-auth-db.sql:/docker-entrypoint-initdb.d/init.sql
      - auth_final_data:/var/lib/mysql
    networks:
      - final-network

  transaction-db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: transaction_db
    volumes:
      - ./services/transaction-service/db/init-transaction-db.sql:/docker-entrypoint-initdb.d/init.sql
      - transaction_final_data:/var/lib/mysql
    networks:
      - final-network

  asset-db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: asset_db
    volumes:
      - ./services/asset-service/db/init-asset-db.sql:/docker-entrypoint-initdb.d/init.sql
      - asset_final_data:/var/lib/mysql
    networks:
      - final-network

  integration-db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: integration_db
    volumes:
      - ./services/integration-service/db/init-integration-db.sql:/docker-entrypoint-initdb.d/init.sql
      - integration_final_data:/var/lib/mysql
    networks:
      - final-network

  analytics-mongo:
    image: mongo:6.0
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo_admin
      MONGO_INITDB_ROOT_PASSWORD: mongo_password
      MONGO_INITDB_DATABASE: analytics_db
    volumes:
      - ./services/analytics-service/db/init-mongo.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
      - mongo_final_data:/data/db
    networks:
      - final-network

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_final_data:/data
    networks:
      - final-network

networks:
  final-network:
    driver: bridge

volumes:
  auth_final_data:
  transaction_final_data:
  asset_final_data:
  integration_final_data:
  mongo_final_data:
  redis_final_data:
