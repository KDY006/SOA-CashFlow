# =============================================================================
# SOA-CashFlow: Docker Compose - Báo cáo Cuối kỳ (Final Phase)
# Tối ưu: Tái sử dụng trực tiếp các Docker Image đã build từ Midterm
# Chỉ build duy nhất Notification Service (nâng cấp Framework Express + Socket.io + OTP)
# =============================================================================
version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # API GATEWAY (Nhóm trưởng)
  # Tái sử dụng image có sẵn từ midterm: soa-cashflow-gateway
  # ---------------------------------------------------------------------------
  gateway:
    image: soa-cashflow-gateway:latest
    build:
      context: ./gateway/midterm
      dockerfile: Dockerfile
    container_name: cashflow-gateway-final
    restart: always
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      - APP_ENV=production
      - GATEWAY_PORT=8080
      - GATEWAY_HOST=0.0.0.0
      - AUTH_SERVICE_URL=http://auth-service:8081
      - JWT_SECRET=${JWT_SECRET:-${AUTH_JWT_SECRET:?set JWT_SECRET or AUTH_JWT_SECRET}}
      - TRANSACTION_SERVICE_URL=http://transaction-service:8082
      - ASSET_SERVICE_URL=http://asset-service:8083
      - ANALYTICS_SERVICE_URL=http://analytics-service:8084
      - INTEGRATION_SERVICE_URL=http://integration-service:8085
      - NOTIFICATION_SERVICE_URL=http://notification-service:8086
      - JWT_SECRET=${AUTH_JWT_SECRET:-cashflow-auth-midterm-development-secret-key}
    depends_on:
      - auth-service
      - transaction-service
      - asset-service
      - analytics-service
      - integration-service
      - notification-service
    networks:
      - final-network

  # ---------------------------------------------------------------------------
  # 1. AUTH SERVICE (Java 17)
  # Tái sử dụng image có sẵn từ midterm: soa-cashflow-auth-service
  # ---------------------------------------------------------------------------
  auth-service:
    image: soa-cashflow-auth-service:latest
    build:
      context: ./services/auth-service/midterm
      dockerfile: Dockerfile
    container_name: cashflow-auth-final
    restart: always
    ports:
      - "${AUTH_SERVICE_PORT:-8081}:8081"
    environment:
      - PROFILE=native
      - DB_HOST=auth-db
      - DB_PORT=3306
      - DB_NAME=auth_db
      - DB_USER=root
      - DB_PASSWORD=root_password
      - JWT_SECRET=${AUTH_JWT_SECRET:-cashflow-auth-midterm-development-secret-key}
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - final-network

  # ---------------------------------------------------------------------------
  # 2. TRANSACTION SERVICE (PHP 8.2)
  # Tái sử dụng image có sẵn từ midterm: soa-cashflow-transaction-service
  # ---------------------------------------------------------------------------
  transaction-service:
    image: soa-cashflow-transaction-service:latest
    build:
      context: ./services/transaction-service/midterm
      dockerfile: Dockerfile
    container_name: cashflow-transaction-final
    restart: always
    ports:
      - "${TRANSACTION_SERVICE_PORT:-8082}:8082"
    environment:
      - PROFILE=native
      - DB_HOST=transaction-db
      - DB_PORT=3306
      - DB_NAME=transaction_db
      - DB_USER=root
      - DB_PASSWORD=root_password
    depends_on:
      - transaction-db
    networks:
      - final-network

  # ---------------------------------------------------------------------------
  # 3. ASSET SERVICE (C# .NET 10)
  # Tái sử dụng image có sẵn từ midterm: soa-cashflow-asset-service
  # ---------------------------------------------------------------------------
  asset-service:
    image: soa-cashflow-asset-service:latest
    build:
      context: ./services/asset-service/midterm
      dockerfile: Dockerfile
    container_name: cashflow-asset-final
    restart: always
    ports:
      - "${ASSET_SERVICE_PORT:-8083}:8083"
    environment:
      - PROFILE=native
      - PORT=8083
      - LISTEN_HOST=*
      - DB_HOST=asset-db
      - DB_CONNECTION=Server=asset-db;Port=3306;Database=asset_db;Uid=root;Pwd=root_password;
    depends_on:
      - asset-db
    networks:
      - final-network

  # ---------------------------------------------------------------------------
  # 4. ANALYTICS SERVICE (Python 3.11)
  # Tái sử dụng image có sẵn từ midterm: soa-cashflow-analytics-service
  # ---------------------------------------------------------------------------
  analytics-service:
    image: soa-cashflow-analytics-service:latest
    build:
      context: ./services/analytics-service
      dockerfile: midterm/Dockerfile
    container_name: cashflow-analytics-final
    restart: always
    ports:
      - "${ANALYTICS_SERVICE_PORT:-8084}:8084"
    environment:
      - HOST=0.0.0.0
      - PORT=8084
      - TRANSACTION_SERVICE_URL=http://transaction-service:8082
      - ANALYTICS_DB_HOST=${ANALYTICS_DB_HOST:-analytics-db}
      - ANALYTICS_DB_PORT=${ANALYTICS_DB_PORT:-3306}
      - ANALYTICS_DB_NAME=${ANALYTICS_DB_NAME:-analytics_db}
      - ANALYTICS_DB_USER=${ANALYTICS_DB_USER:-root}
      - ANALYTICS_DB_PASSWORD=${ANALYTICS_DB_PASSWORD:-root_password}
    depends_on:
      - analytics-db
      - transaction-service
    networks:
      - final-network

  # ---------------------------------------------------------------------------
  # 5. INTEGRATION SERVICE (Go 1.22)
  # Tái sử dụng image có sẵn từ midterm: soa-cashflow-integration-service
  # ---------------------------------------------------------------------------
  integration-service:
    image: soa-cashflow-integration-service:latest
    build:
      context: ./services/integration-service/midterm
      dockerfile: Dockerfile
    container_name: cashflow-integration-final
    restart: always
    ports:
      - "${INTEGRATION_SERVICE_PORT:-8085}:8085"
    environment:
      - PROFILE=native
      - PORT=8085
      - DB_HOST=integration-db
      - DB_PORT=3306
      - DB_NAME=integration_db
      - DB_USER=root
      - DB_PASSWORD=root_password
      - TRANSACTION_SERVICE_URL=http://transaction-service:8082
      - NOTIFICATION_SERVICE_URL=http://notification-service:8086
      - SYNC_WORKERS=4
    depends_on:
      - integration-db
      - transaction-service
      - notification-service
    networks:
      - final-network

  # ---------------------------------------------------------------------------
  # 6. NOTIFICATION SERVICE (Nhóm trưởng - Nâng cấp Framework Express.js + Socket.io + OTP)
  # ---------------------------------------------------------------------------
  notification-service:
    image: cashflow-notification-final:latest
    build:
      context: ./services/notification-service/final
      dockerfile: Dockerfile
    container_name: cashflow-notification-final
    restart: always
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-8086}:8086"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - NOTIFICATION_SERVICE_PORT=8086
      - PORT=8086
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_CHANNEL=cashflow:notifications
      - REDIS_EVENTS_CHANNEL=cashflow:events
      - OTP_TTL_SECONDS=300
    depends_on:
      - redis
    networks:
      - final-network

  # ===========================================================================
  # CƠ SỞ DỮ LIỆU & MESSAGE BROKERS (DATABASE-PER-SERVICE)
  # Tái sử dụng trực tiếp các image chuẩn: mysql:8.0 và redis:7-alpine
  # ===========================================================================

  auth-db:
    image: mysql:8.0
    container_name: cashflow-auth-db-final
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "${AUTH_FINAL_DB_PASSWORD:?set AUTH_FINAL_DB_PASSWORD}"
      MYSQL_DATABASE: auth_db
    ports:
      - "3307:3306"
    volumes:
      - ./services/auth-service/db/init-auth-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - auth_final_data:/var/lib/mysql
    networks:
      - final-network

  transaction-db:
    image: mysql:8.0
    container_name: cashflow-transaction-db-final
    restart: always
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: transaction_db
    volumes:
      - ./services/transaction-service/db/init-transaction-db.sql:/docker-entrypoint-initdb.d/init.sql
      - transaction_final_data:/var/lib/mysql
    networks:
      - final-network

  asset-db:
    image: mysql:8.0
    container_name: cashflow-asset-db-final
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: asset_db
    volumes:
      - ./services/asset-service/db/init-asset-db.sql:/docker-entrypoint-initdb.d/init.sql
      - asset_final_data:/var/lib/mysql
    networks:
      - final-network

  integration-db:
    image: mysql:8.0
    container_name: cashflow-integration-db-final
    restart: always
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3310:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: integration_db
    volumes:
      - ./services/integration-service/db/init-integration-db.sql:/docker-entrypoint-initdb.d/init.sql
      - integration_final_data:/var/lib/mysql
    networks:
      - final-network

  analytics-db:
    image: mysql:8.0
    container_name: cashflow-analytics-db-final
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${ANALYTICS_DB_PASSWORD:-root_password}
      MYSQL_DATABASE: ${ANALYTICS_DB_NAME:-analytics_db}
    volumes:
      - ./services/analytics-service/db/init-analytics-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - analytics_final_data:/var/lib/mysql
    networks:
      - final-network

  redis:
    image: redis:7-alpine
    container_name: cashflow-redis-final
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_final_data:/data
    networks:
      - final-network

# =============================================================================
# MẠNG NỘI BỘ VÀ VOLUMES
# =============================================================================
networks:
  final-network:
    name: cashflow-final-net
    driver: bridge

volumes:
  auth_final_data:
  transaction_final_data:
  asset_final_data:
  integration_final_data:
  analytics_final_data:
  redis_final_data:
