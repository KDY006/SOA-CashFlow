services:
  gateway:
    build: ../../../gateway
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      APP_ENV: production
      AUTH_SERVICE_URL: http://auth-service:8081
      JWT_SECRET: "${JWT_SECRET:-${AUTH_JWT_SECRET:?set JWT_SECRET or AUTH_JWT_SECRET}}"
    depends_on:
      - auth-service

  auth-service:
    build: .
    ports:
      - "${AUTH_SERVICE_PORT:-8081}:8081"
    environment:
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-prod}"
      DB_HOST: auth-db
      DB_PORT: 3306
      DB_NAME: auth_db
      DB_USER: root
      DB_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD}"
      DB_ALLOW_PUBLIC_KEY_RETRIEVAL: "true"
      JWT_SECRET: "${JWT_SECRET:-${AUTH_JWT_SECRET:?set JWT_SECRET or AUTH_JWT_SECRET}}"
      AUTH_CORS_ORIGINS: "${AUTH_CORS_ORIGINS:-}"
    depends_on:
      auth-db:
        condition: service_healthy

  auth-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD}"
      MYSQL_DATABASE: auth_db
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysql --protocol=TCP -h127.0.0.1 -uroot -Dauth_db -e 'SELECT 1 FROM refresh_tokens LIMIT 0'"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - ../db/init-auth-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - auth_demo_data:/var/lib/mysql

volumes:
  auth_demo_data:
