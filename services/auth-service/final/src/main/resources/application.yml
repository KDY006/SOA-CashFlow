server:
  port: ${SERVER_PORT:8081}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:auth_db}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&sslMode=${DB_SSL_MODE:PREFERRED}&allowPublicKeyRetrieval=${DB_ALLOW_PUBLIC_KEY_RETRIEVAL:false}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 5000
      initialization-fail-timeout: 15000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  mvc:
    log-request-details: false
logging:
  level:
    org.springframework.web.servlet.mvc.method.annotation: WARN
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: "OFF"
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
auth:
  cors-origins: ${AUTH_CORS_ORIGINS:}
